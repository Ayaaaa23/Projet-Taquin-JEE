<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquin - Jeu</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div>
        <h1> Puzzle Glissant</h1>

        <div class="info">
            Niveau : <span th:text="${partie.niveau}"></span> |
            Mouvements : <span th:text="${partie.score}"></span> |
            ⏱️ <span id="chrono">0:00</span>
        </div>

        <!-- Apercu de l'image originale -->
        <div style="text-align: center; margin-bottom: 20px;">
            <p>📸 Modele :</p>
            <th:block th:with="imageName=${partie.niveau == 1 ? 'photo1.png' : (partie.niveau == 2 ? 'photo2.jpg' : 'photo3.jpg')}">
                <img th:src="@{'/images/' + ${imageName}}"
                     alt="Image complete"
                     style="width: 180px; border-radius: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            </th:block>
        </div>

        <!-- Grille de jeu -->
        <div class="grid" th:style="'grid-template-columns: repeat(' + ${taille} + ', 80px);'">
            <th:block th:each="row, rowStat : ${grille}">
                <th:block th:each="val, colStat : ${row}">
                    <div th:if="${val != videIndex}"
     class="cell"
     th:data-row="${rowStat.index}"
     th:data-col="${colStat.index}"
     onclick="deplacer(this)">
    <img th:src="'/images/niveau' + ${partie.niveau} + '/' + ${val} + '.png'"
         th:alt="${val}">
    <span class="piece-number" th:text="${val}"></span>
</div>
                    <div th:if="${val == videIndex}" class="cell empty"></div>
                </th:block>
            </th:block>
        </div>

        <!-- Formulaire de deplacement -->
        <form id="deplacerForm" action="/deplacer" method="post">
            <input type="hidden" name="partieId" th:value="${partie.id}">
            <input type="hidden" name="row" id="row">
            <input type="hidden" name="col" id="col">
        </form>

        <!-- Boutons -->
        <div>
            <a href="/menu"><button type="button"> Menu principal</button></a>
            <button type="button" onclick="rejouer()"> Rejouer</button>
            <form action="/sauvegarder" method="post" style="display: inline;">
                <input type="hidden" name="partieId" th:value="${partie.id}">
                <button type="submit"> Sauvegarder</button>
                <button type="button" id="indiceBtn" onclick="toggleIndices()">🔍 Indice</button>
            </form>
        </div>
    </div>

    <script>
        // Récupération de l'ID de la partie depuis Thymeleaf
        const partieId = [[${partie.id}]];

// Sauvegarde du scroll avant rechargement
window.addEventListener('beforeunload', function() {
    localStorage.setItem('scrollPos', window.scrollY);
});
// Restauration du scroll après rechargement
window.addEventListener('load', function() {
    let scrollPos = localStorage.getItem('scrollPos');
    if (scrollPos) {
        window.scrollTo(0, parseInt(scrollPos));
        localStorage.removeItem('scrollPos');
    }
});

        // Met à jour l'affichage du chronomètre
        function updateChronoDisplay() {
            let start = localStorage.getItem('start_' + partieId);
            let chronoElem = document.getElementById('chrono');
            if (!chronoElem) return;

            if (!start) {
                chronoElem.innerText = '0:00';
                return;
            }

            let elapsed = Math.floor((Date.now() - parseInt(start)) / 1000);
            let minutes = Math.floor(elapsed / 60);
            let seconds = elapsed % 60;
            chronoElem.innerText = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        // Fonction appelée lors d'un déplacement (clic sur une case)
        function deplacer(cell) {
            // Démarrer le chronomètre si ce n'est pas encore fait
            let startKey = 'start_' + partieId;
            if (!localStorage.getItem(startKey)) {
                localStorage.setItem(startKey, Date.now());
            }

            document.getElementById('row').value = cell.getAttribute('data-row');
            document.getElementById('col').value = cell.getAttribute('data-col');
            document.getElementById('deplacerForm').submit();
        }

        // Fonction Rejouer
        function rejouer() {
            fetch('/rejouer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'partieId=' + partieId
            }).then(response => {
                if (response.ok) {
                    // Supprimer la clé du chronomètre pour cette partie
                    localStorage.removeItem('start_' + partieId);
                    window.location.reload();
                } else {
                    alert('Erreur lors du rejeu');
                }
            });
        }
        // Afficher/masquer les indices (numéros des pièces)
let indicesVisible = false;
function toggleIndices() {
    const spans = document.querySelectorAll('.piece-number');
    indicesVisible = !indicesVisible;
    spans.forEach(span => {
        span.style.display = indicesVisible ? 'block' : 'none';
    });
    const btn = document.getElementById('indiceBtn');
    btn.textContent = indicesVisible ? '🙈 Masquer indices' : '🔍 Afficher indices';
}

        // Mise à jour périodique de l'affichage
        setInterval(updateChronoDisplay, 1000);
        // Affichage initial
        updateChronoDisplay();
    </script>

    <!-- Message de victoire -->
    <script th:if="${partie.terminee}">
        let divVictoire = document.createElement('div');
        divVictoire.className = 'victoire-message';
        divVictoire.innerText = '🎉 FELICITATIONS ! Vous avez gagne en ' + [[${partie.score}]] + ' mouvements ! 🎉';
        document.querySelector('.grid').before(divVictoire);
        document.querySelectorAll('.cell:not(.empty)').forEach(cell => {
            cell.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
