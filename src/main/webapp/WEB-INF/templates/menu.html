<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Puzzle Taquin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div>
        <h1>📋 Menu Principal</h1>
        <h3>✨ Nouvelle partie</h3>
        <div>
            <a href="/nouvelle-partie?niveau=1" class="btn">🌟 Niveau 1 (3x3)</a>
            <a href="/nouvelle-partie?niveau=2" class="btn">⚡ Niveau 2 (4x4)</a>
            <a href="/nouvelle-partie?niveau=3" class="btn">🔥 Niveau 3 (5x5)</a>
        </div>

        <div class="sauvegarde" th:if="${!parties.isEmpty()}">
            <h3>💾 Parties sauvegardées</h3>
            <ul>
                <li th:each="p : ${parties}">
                    <a th:href="'/jeu?partieId=' + ${p.id}" class="btn" style="background: #28a745;">
                        Niveau [[${p.niveau}]] - Mouvements: [[${p.score}]] - [[${p.dateSauvegarde}]]
                    </a>
                </li>
            </ul>
        </div>
        <div th:if="${parties.isEmpty()}">
            <p>📭 Aucune partie sauvegardée. Commencez une nouvelle aventure !</p>
        </div>
    </div>
</body>
</html>
